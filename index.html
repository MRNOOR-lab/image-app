<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image search app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.css" integrity="sha512-fzJke8xUCPckf6D3vvPcXdIRhcRZORh0+PxSElFI6Ym6G+IiwQiCurZTu0l7tNPvHVZk0wf7tRu0+ip6h+RrVA==" crossorigin="anonymous" referrerpolicy="no-referrer">

    
</head>
<body>
    <header>
        <h1>image search app</h1>
        <form action="" class="search_form">
            <div class="input_box">
                <input type="text" placeholder="search image" class="input">
            <span><i class="fa-solid fa-magnifying-glass"></i></span>
            </div>
        </form>
    </header>

    <main>
        <section class="main_section">
            <div class="image_continer">
                <h2>No image to show</h2>
            </div>
            <button class="load_more_btn">LoadMore</button>
        </section>
    </main>

    <script src="java.js"></script>
</body>
</html>
